image boot.vfat {
	vfat {
		files = {
			"bcm2711-rpi-4-b.dtb",
			"start4.elf",
			"fixup4.dat",
			"config.txt",
			"cmdline.txt",
			"Image"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
