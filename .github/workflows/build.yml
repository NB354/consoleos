name: Compiler ConsoleOS

# Se déclenche manuellement depuis l'onglet "Actions" de GitHub (bouton
# "Run workflow"), ou automatiquement à chaque push sur main.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # Runner géré par GitHub : Ubuntu récent, ~14 Go de RAM, 2 vCPU, réseau
    # complet, aucun des problèmes rencontrés sur une machine locale
    # (RAM/swap limités, distribution trop récente, droits root...).
    runs-on: ubuntu-latest
    timeout-minutes: 350   # marge large ; une compilation complète Buildroot
                           # prend généralement 1h30 à 3h sur ce type de runner

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les dépendances de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            which sed make binutils build-essential diffutils gcc g++ bash \
            patch gzip bzip2 perl tar cpio unzip rsync file bc findutils gawk \
            wget ca-certificates git bison flex libncurses-dev libssl-dev \
            pkg-config python3 python3-setuptools cvs mercurial subversion \
            locales-all whiptail

      - name: Compiler ConsoleOS
        run: |
          cd tools
          ./build.sh

      - name: Publier l'image générée
        uses: actions/upload-artifact@v4
        with:
          name: consoleos-sdcard-image
          path: buildroot/output/images/sdcard.img
          retention-days: 14

      - name: Publier les logs de build en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consoleos-build-logs
          path: |
            buildroot/output/build/build-time.log
            buildroot/.config
          retention-days: 14
